name: Guard main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse framework content on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0

          dirs=$(git diff --name-only "$BASE" "$HEAD" -- 'skills/superwall-framework/**' || true)
          if [ -n "$dirs" ]; then
            echo "::error::skills/superwall-framework belongs on next, not main:"
            echo "$dirs"
            status=1
          fi

          pattern='superwall-framework|superwall (create|dev|push|promote|publish)\b|superwall migrate (<paywall|[0-9])|--screen\b|SUPERWALL_CHANNEL|/tree/next'
          leaks=$(git diff "$BASE" "$HEAD" -- . ':(exclude).github/workflows/guard-main.yml' ':(exclude)AUTHORING.md' \
            | grep -E '^\+[^+]' | grep -E "$pattern" || true)
          if [ -n "$leaks" ]; then
            echo "::error::these added lines point agents at the framework; keep them on next:"
            echo "$leaks"
            status=1
          fi

          exit $status

name: Guard main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify plugin package
        run: |
          npm run plugin:check
          npm run plugin:test

      - name: Refuse links to next on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          leaks=$(git diff "$BASE" "$HEAD" -- . ':(exclude).github/workflows/guard-main.yml' ':(exclude)AUTHORING.md' \
            | grep -E '^\+[^+]' | grep -E '/tree/next' || true)
          if [ -n "$leaks" ]; then
            echo "::error::public skills install from main; these added lines point agents at next:"
            echo "$leaks"
            exit 1
          fi

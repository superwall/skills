name: Sync main into next

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-next
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'superwall/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: next
          fetch-depth: 0

      # A clean merge is pushed straight to next. A conflict is not left as a
      # red run nobody reads: main is pushed to sync/main-into-next and a pull
      # request against next is opened (or refreshed), so whoever merged to
      # main resolves it in the normal review flow. Only an open pull request
      # counts, and a branch holding resolution commits is never reset.
      - name: Merge main into next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge --no-edit origin/main; then
            git push origin next
            exit 0
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          git merge --abort
          branch=sync/main-into-next
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base next --json number,headRefName \
            --jq 'map(select(.headRefName | startswith("sync/main-into-next"))) | first | select(. != null) | "\(.number) \(.headRefName)"')
          pr=${open%% *}
          head=${open#* }
          body=$(printf 'main does not merge cleanly into next. Conflicts:\n\n```\n%s\n```\n\nResolve on this branch (keep next'"'"'s beta content; take main'"'"'s additions), then merge it into next with a merge commit, never a squash. Re-run `npm run plugin:sync` on next afterwards if a toolkit skill changed.' "$conflicts")
          if [ -n "$open" ] && [ "$head" != "$branch" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\nmain moved while %s holds the resolution, so %s was left alone. Merge origin/main into %s again before merging.' "$body" "$head" "$branch" "$head")"
            echo "::error::main does not merge cleanly into next — pull request #$pr from $head is open"
            echo "$conflicts"
            exit 1
          fi
          resolving=0
          if git fetch origin "refs/heads/$branch" 2> /dev/null; then
            resolving=$(git rev-list --count FETCH_HEAD --not origin/main HEAD)
          fi
          if [ "$resolving" -gt 0 ]; then
            body=$(printf '%s\n\nmain moved while this branch holds a resolution in progress, so the branch was kept. Merge origin/main into it again before merging.' "$body")
          else
            git push --force origin origin/main:refs/heads/$branch
          fi
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base next --head "$branch" \
              --title "Sync main into next (conflict)" --body "$body"
          fi
          echo "::error::main does not merge cleanly into next — a pull request from $branch is open"
          echo "$conflicts"
          exit 1
